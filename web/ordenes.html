<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Órdenes | Logística</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-orders">
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <img src="assets/logo.png" alt="Logo">
        </div>
        <div class="text">
          <div class="t1">Logística y Abastecimiento</div>
          <div class="t2">Municipalidad Distrital Veintisiete de Noviembre</div>
        </div>
      </div>

      <nav class="nav">
        <a href="index.html"><div class="badge">🏠</div><span class="label">Inicio</span></a>
        <a href="ordenes.html" style="border-color: var(--stroke); background: rgba(255,255,255,.08); color: var(--text);"><div class="badge">📄</div><span class="label">Órdenes</span></a>
        <a href="recursos.html"><div class="badge">🔗</div><span class="label">Recursos</span></a>
        <a href="admin.html"><div class="badge">🛡️</div><span class="label">Admin</span></a>
      </nav>
      <!-- El bloque Fecha/Hora + Monto lo inyecta layout.js automáticamente -->
    </aside>

    <main class="main">
      <div class="container">
        <header class="topbar">
          <div class="left">
            <button class="btn-icon" data-sidebar-toggle title="Ocultar/Mostrar menú">☰</button>
            <button class="btn-icon" data-filters-toggle title="Ocultar/Mostrar filtros">⟷</button>
            <div>
              <div style="font-weight:900; letter-spacing:.2px">Órdenes</div>
              <small>Filtros, detalle y exportación</small>
            </div>
          </div>
          <div class="right">
            <span class="pill pill-strong" id="suminfo" title="Suma de PRECIO X ORDEN del filtro actual">Total: —</span>
          </div>
        </header>

        <div class="orders-layout">
          <aside class="filters-panel card" id="filtersPanel">
            <div class="filters-head">
              <h2 style="margin:0">Filtros</h2>
              <button class="btn-icon" id="filtersToggle" title="Ocultar/Mostrar filtros">⟷</button>
            </div>

            <div class="controls controls-vertical">
              <input id="exp_siaf" placeholder="EXP SIAF" />
              <select id="order_type">
                <option value="">TIPO DE ORDEN (todos)</option>
                <option value="O/C">ORDEN DE COMPRA</option>
                <option value="O/S">ORDEN DE SERVICIO</option>
              </select>
              <input id="order_number" placeholder="N° DE ORDEN" />
              <input id="supplier" placeholder="Razón Social / RUC" />
              <select id="status"></select>
              <input id="q" placeholder="Búsqueda general" />
              <label class="mini-label" for="from">Desde</label>
              <input id="from" type="date" />
              <label class="mini-label" for="to">Hasta</label>
              <input id="to" type="date" />

              <select id="limit">
                <option value="20">20 por página</option>
                <option value="50">50 por página</option>
                <option value="100">100 por página</option>
              </select>

              <div class="actions actions-vertical">
                <button class="btn btn-primary" id="buscar">Aplicar</button>
                <button class="btn btn-ghost" id="limpiar" type="button">Limpiar</button>
                <button class="btn btn-ghost" id="export" type="button">Exportar</button>
              </div>
            </div>

            <div id="error" style="display:none;color:#ffb4b4; margin-top:10px;"></div>
          </aside>

          <section class="card orders-list-card">
            <div class="listado-header">
              <h2>Listado</h2>

              <div class="pager pager-inline" id="pagerTop">
                <button id="prevTop" class="pager-btn">← Anterior</button>

                <div class="pill page-pill" id="pageinfoTop">Página 1 / 1</div>

                <div class="pager-go">
                  <input id="gotoTop" type="number" min="1" placeholder="N°" />
                  <button id="gotoBtnTop" type="button" class="pager-btn small">Ir</button>
                </div>

                <button id="nextTop" class="pager-btn">Siguiente →</button>
              </div>
            </div>

            <div class="tablewrap orders-tablewrap">
              <table>
                <thead>
                  <tr id="theadRow"></tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>

          </section>
        </div>

        <footer class="footer">
          <div>© 2026 • Todos los Derechos Reservados</div>
          <div class="footer-right">Aplicativo creado por <span class="email">JorgeArmandoRoblesM@gmail.com</span></div>
        </footer>
      </div>
    </main>
  </div>

  <!-- Modal detalle -->
  <div id="modalBack" class="modal-backdrop">
    <div class="modal">
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script src="ordenes.js"></script>
</body>
</html>
